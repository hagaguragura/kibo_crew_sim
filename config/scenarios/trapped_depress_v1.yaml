name: trapped_depress_v1
duration_sec: 600   # 10 分
description: "KIBOU 内取り残し減圧 — 生存圏内シナリオ (O2 最低 17%)"

events:
  - t: 30
    label: "leak_starts"
    alarm: true
    transitions:
      o2:       {from: 21.0,  to: 19.0,  duration: 90}
      pressure: {from: 101.3, to: 95.0,  duration: 90}

  - t: 120
    label: "warning"
    transitions:
      o2:       {from: 19.0,  to: 18.0,  duration: 180}
      pressure: {from: 95.0,  to: 88.0,  duration: 180}

  - t: 300
    label: "concern"
    transitions:
      o2:       {from: 18.0,  to: 17.0,  duration: 180}
      pressure: {from: 88.0,  to: 80.0,  duration: 180}

  # T+480 以降は平衡（17.0% / 80.0 kPa で固定。致命域 <14% には入らない）
